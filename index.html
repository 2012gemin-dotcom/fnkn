<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsiriq</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #2098D1;
            background-color: #e1e1e1;
            border: none;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
            overflow: hidden;
        }

        .btn::before {
            content: "";
            position: absolute;
            background: #2098D1;
            z-index: -1;
            transition: transform 0.3s ease-out;
        }

        .btn:hover {
            color: white;
        }

        .sweep-right::before {
            top: 0; left: 0; bottom: 0; right: 0;
            transform: scaleX(0);
            transform-origin: 0 50%;
        }
        .sweep-right:hover::before {
            transform: scaleX(1);
        }

        .sweep-left::before {
            top: 0; left: 0; bottom: 0; right: 0;
            transform: scaleX(0);
            transform-origin: 100% 50%;
        }
        .sweep-left:hover::before {
            transform: scaleX(1);
        }

        .sweep-bottom::before {
            top: 0; left: 0; bottom: 0; right: 0;
            transform: scaleY(0);
            transform-origin: 50% 0;
        }
        .sweep-bottom:hover::before {
            transform: scaleY(1);
        }

        .sweep-top::before {
            top: 0; left: 0; bottom: 0; right: 0;
            transform: scaleY(0);
            transform-origin: 50% 100%;
        }
        .sweep-top:hover::before {
            transform: scaleY(1);
        }
    </style>
</head>
<body>

    <button class="btn sweep-right">Sweep To Right</button>
    <button class="btn sweep-left">Sweep To Left</button>
    <button class="btn sweep-bottom">Sweep To Bottom</button>
    <button class="btn sweep-top">Sweep To Top</button>

</body>
</html>

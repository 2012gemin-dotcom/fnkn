<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fiqurlar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Əsas çərçivə və tor quruluşu (Grid) */
        .grid-container {
            display: grid;
            /* Ölçüləri bilərəkdən fərqli və nizamsız qoyulub */
            grid-template-columns: 1.2fr 1.1fr 1.8fr 1.1fr;
            grid-template-rows: 1.3fr 1.5fr 1.2fr;
            gap: 15px; /* Fiqurlar arasındakı qara boşluqlar */
            width: 100%;
            max-width: 900px;
            height: 450px;
            background-color: #2c2c2c; /* Şəkildəki tünd fon rəngi */
            padding: 15px;
        }

        /* Rəng şablonları */
        .red    { background-color: #f0544f; }
        .blue   { background-color: #29b6cc; }
        .yellow { background-color: #d4b26f; }
        .white  { background-color: #ffffff; }

        /* Hər bir kvadratın grid üzərindəki yerləşməsi */
        .box-1 { grid-column: 1; grid-row: 1 / 3; }
        .box-2 { grid-column: 2; grid-row: 1; }
        .box-3 { grid-column: 3 / 5; grid-row: 1; }
        
        .box-4 { grid-column: 1; grid-row: 3; }
        .box-5 { grid-column: 2; grid-row: 2; }
        .box-6 { grid-column: 3; grid-row: 2; }
        .box-7 { grid-column: 4; grid-row: 2 / 4; }
        
        .box-8 { grid-column: 2; grid-row: 3; }
        .box-9 { grid-column: 3; grid-row: 3; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="box-1 red"></div>
        <div class="box-2 blue"></div>
        <div class="box-3 yellow"></div>

        <div class="box-4 white"></div>
        <div class="box-5 yellow"></div>
        <div class="box-6 white"></div>
        <div class="box-7 red"></div>

        <div class="box-8 red"></div>
        <div class="box-9 blue"></div>
    </div>

</body>
</html>

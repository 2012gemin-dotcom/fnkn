<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sekil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #222;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard {
            width: 100%;
            max-width: 1200px;
            display: grid;
            
            grid-template-columns: repeat(6, minmax(100px, 1fr));
            
            grid-auto-rows: 140px;
            gap: 15px;
        }

       
        .card {
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Yazıları aşağı bərkidir */
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

       
        .leaderboard {
            grid-column: span 2;
            grid-row: span 2;
            background-color: #e0e0e0;
            color: #333;
        }

       
        .food {
            grid-column: span 3;
            background-color: #2ecc71;
        }

       
        .general-knowledge {
            grid-column: span 1;
            background-color: #f1c40f;
            color: #333;
        }

       
        .history {
            grid-column: span 4;
            background-color: #3498db;
        }

      
        .geography {
            grid-column: span 2;
            grid-row: span 2;
            background-color: #e74c3c;
        }

       
        .entertainment {
            grid-column: span 2;
            background-color: #9b59b6;
        }

      
        .sports {
            grid-column: span 1;
            background-color: #e67e22;
        }

        .science {
            grid-column: span 3;
            background-color: #1abc9c;
        }

        
        .music {
            grid-column: span 1;
            background-color: #34495e;
        }

        
        .profile {
            grid-column: span 2;
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="card leaderboard">
            <div class="card-footer">
                <span>Leaderboard</span>
                <span>➔</span>
            </div>
        </div>

        <div class="card food">
            <div class="card-footer">
                <span>Food & Drink</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card general-knowledge">
            <div class="card-footer">
                <span>General Knowledge</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card history">
            <div class="card-footer">
                <span>History</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card geography">
            <div class="card-footer">
                <span>Geography</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card entertainment">
            <div class="card-footer">
                <span>Entertainment</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card sports">
            <div class="card-footer">
                <span>Sports</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card science">
            <div class="card-footer">
                <span>Science and Nature</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card music">
            <div class="card-footer">
                <span>Music</span>
                <span>▶</span>
            </div>
        </div>

        <div class="card profile">
            <div class="card-footer">
                <span>Profile</span>
                <span>➔</span>
            </div>
        </div>

    </div>

</body>
</html>
